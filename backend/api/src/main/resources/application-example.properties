# 1. Nome da aplicação
spring.application.name=api

# 2. URL de Conexão com o Banco de Dados
# Lembre-se de ajustar o host e porta se o banco estiver em outro servidor
spring.datasource.url=jdbc:mysql://localhost:3306/instituto_luz_de_lo?createDatabaseIfNotExist=true&serverTimezone=UTC

# 3. Credenciais de Acesso (Deixe vazio ou com instrução para o seu time)
spring.datasource.username=seu_usuario_aqui
spring.datasource.password=sua_senha_aqui

# 4. Driver oficial do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 5. Hibernate: 'update' cria/atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# 6. Debug SQL (Mantenha true apenas para desenvolvimento)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 7. Dialeto
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 8. Configurações do Cloudinary
# Instrução: Preencha com os dados fornecidos pelo painel do Cloudinary
cloudinary.cloud-name=seu_cloud_name
cloudinary.api-key=sua_api_key
cloudinary.api-secret=sua_api_secret

# 9. Expor endpoints do Actuator
management.endpoints.web.exposure.include=*

# 10. Desabilitar exportação para o Elastic (Micrometer)
management.metrics.export.elastic.enabled=false
