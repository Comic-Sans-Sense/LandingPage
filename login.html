<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">

  <div class="login-left">
    <h1>Transformando solidariedade em ação</h1>
    <p>Levamos acolhimento, alimento e dignidade para quem mais precisa.</p>
  </div>

  <div class="login-right">
    <div class="login-box">
      <h2>Instituto Luz de Ló</h2>
      <p>Área restrita</p>

      <h3 style="font-size:32px; margin-bottom:10px; margin-top:30px;">
        Acesse o painel
      </h3>

      <p>
        Digite a senha de acesso do instituto para continuar.
      </p>

      <label style="font-weight:bold; display:block; margin-top:20px;">E-mail de acesso</label>
<input id="email" type="email" placeholder="Digite seu e-mail...">

<label style="font-weight:bold; display:block; margin-top:10px;">Senha de acesso</label>
<input id="senha" type="password" placeholder="Digite a senha...">

<button onclick="login()" class="btn btn-cyan" style="width:100%; margin-top: 15px;">Acessar</button>

      <p style="text-align:center; margin-top:20px;">
        Acesso exclusivo para membros do instituto.
      </p>
    </div>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
